<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Monomythos · codice di accesso</title>
<style>
  :root { --bg: #0d1020; --fg: #f4f1e8; --accent: #ffe033; --box: #1b2040; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; padding: 16px; box-sizing: border-box; }
  main { max-width: 560px; width: 100%; }
  h1 { color: var(--accent); font-size: 1.4rem; }
  textarea { width: 100%; box-sizing: border-box; min-height: 110px; background: var(--box); color: var(--fg); border: 2px solid var(--accent); border-radius: 8px; padding: 10px; font: 14px monospace; }
  button { margin-top: 10px; background: var(--accent); color: #111; border: 0; border-radius: 8px; padding: 10px 18px; font-weight: 700; cursor: pointer; }
  p.err { color: #ff8a8a; }
</style>
</head>
<body>
<main>
  <h1>Codice di accesso per i video automatici</h1>
  <p id="msg">Copia questo codice. Poi su GitHub apri Actions → <b>Collega TikTok</b> → Run workflow e incollalo lì (oppure nel terminale dello script <code>promo/token_tiktok.js</code>). Il codice vale pochi minuti.</p>
  <textarea id="code" readonly></textarea>
  <button onclick="navigator.clipboard.writeText(document.getElementById('code').value).then(()=>this.textContent='Copiato!')">Copia</button>
</main>
<script>
  const q = new URLSearchParams(location.search);
  const code = q.get('code');
  if (code) document.getElementById('code').value = code;
  else {
    const m = document.getElementById('msg');
    m.className = 'err';
    m.textContent = 'Nessun codice ricevuto. ' + (q.get('error_description') || q.get('error') || 'Riprova dallo script.');
  }
</script>
</body>
</html>
