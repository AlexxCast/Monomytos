name: Inserisci immagini Gemini

# Antigravity carica le immagini in strumenti/gemini/nuove/<id>.png e fa push:
# questo workflow le mette in gioco e aggiorna le liste dei prompt.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['strumenti/gemini/nuove/**']

permissions:
  contents: write

concurrency:
  group: inserisci-gemini
  cancel-in-progress: false

jobs:
  inserisci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: python strumenti/gemini/inserisci.py
      # il service worker prende prima la rete: non serve cambiare la cache per vedere le immagini nuove
      - name: Salva
        run: |
          git config user.name "monomythos-bot"
          git config user.email "monomythos-bot@users.noreply.github.com"
          git add -A assets/cards/gen js/cards_data.js js/cards_data.json strumenti
          if git diff --cached --quiet; then echo "Niente di nuovo"; exit 0; fi
          git commit -m "Illustrazioni Gemini inserite nel gioco"
          for i in 1 2 3 4 5; do git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0; sleep $((i * 10)); done
          exit 1
