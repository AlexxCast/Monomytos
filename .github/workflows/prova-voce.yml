name: Prova voce
# Campioni di voce sintetica (gratis) per i video: restano 3 giorni come artifact privato del workflow
on:
  workflow_dispatch:
    inputs:
      testo:
        description: 'Testo da leggere'
        default: 'Ogni eroe può cadere. Il Velo si nutre di paura. Chi ne assorbe troppa... passa al Velo.'
permissions:
  contents: read
jobs:
  voce:
    runs-on: ubuntu-latest
    steps:
      - run: pip install -q edge-tts
      - name: Genera le voci
        env:
          TESTO: ${{ inputs.testo }}
        run: |
          sudo apt-get install -y -qq ffmpeg >/dev/null 2>&1 || true
          # voci maschili più profonde e lente; la versione "epica" aggiunge bassi ed eco da trailer
          for v in it-IT-DiegoNeural it-IT-GiuseppeMultilingualNeural; do
            edge-tts --voice "$v" --rate=-12% --pitch=-14Hz --text "$TESTO" --write-media "voce_${v}_profonda.mp3" || continue
            ffmpeg -y -v error -i "voce_${v}_profonda.mp3" -af "asetrate=24000*0.92,aresample=24000,atempo=1.04,bass=g=6:f=110,aecho=0.8:0.6:60|120:0.25|0.15,loudnorm=I=-16" "voce_${v}_epica.mp3"
          done
          ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: voci
          path: voce_*.mp3
          retention-days: 3
