name: Prova Pollinations
on: workflow_dispatch
permissions:
  contents: write
jobs:
  prova:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - run: pip install pillow
      - run: python strumenti/prova_pollinations.py
      - name: Salva le prove nel repo
        run: |
          mkdir -p strumenti/prova_immagini && mv prova/* strumenti/prova_immagini/
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add strumenti/prova_immagini
          git commit -qm "Prove immagini Pollinations"
          for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && break; sleep $((i*20)); done
