name: Prova Pollinations
on: workflow_dispatch
permissions:
  contents: write
jobs:
  prova:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - run: pip install pillow
      - run: python strumenti/prova_pollinations.py
      - name: Salva le prove nel ramo prova-immagini
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan prova-immagini
          git rm -rq --cached .
          git add prova/
          git commit -qm "Prove Pollinations"
          git push -f origin prova-immagini
