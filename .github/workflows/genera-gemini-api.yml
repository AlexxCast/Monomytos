name: Genera immagini Gemini (API)

# Genera le illustrazioni con l'API ufficiale di Gemini (Vertex AI, credito di prova Google Cloud):
# un prompt = una richiesta separata, poi le mette nel gioco con inserisci.py.
# Serve il segreto GCP_SA_KEY (chiave JSON del service account con ruolo "Agent Platform User" (ex Vertex AI User)).
on:
  workflow_dispatch:
    inputs:
      quante:
        description: 'Quante immagini al massimo in questo giro'
        default: '20'
      solo:
        description: 'Solo questi id, separati da virgola (vuoto = in ordine dalle liste)'
        default: ''
      modello:
        description: 'Modello immagini'
        default: 'gemini-3-pro-image-preview'

permissions:
  contents: write

concurrency:
  group: inserisci-gemini
  cancel-in-progress: false

jobs:
  genera:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install pillow google-genai
      - name: Accesso a Google Cloud
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -z "$GCP_SA_KEY" ]; then echo "::error::Manca il segreto GCP_SA_KEY"; exit 1; fi
          printf '%s' "$GCP_SA_KEY" > "$RUNNER_TEMP/gcp.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/gcp.json" >> "$GITHUB_ENV"
      - name: Genera
        env:
          QUANTE: ${{ inputs.quante }}
          SOLO: ${{ inputs.solo }}
          GEMINI_MODELLO: ${{ inputs.modello }}
        run: python strumenti/gemini/genera_api.py
      - name: Salva gli originali per il controllo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: immagini-generate
          path: strumenti/gemini/nuove/*.png
          if-no-files-found: ignore
      - name: Inserisci nel gioco
        if: always()
        run: python strumenti/gemini/inserisci.py
      - name: Salva
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/gcp.json"
          git config user.name "monomythos-bot"
          git config user.email "monomythos-bot@users.noreply.github.com"
          git add -A assets/cards/gen assets/storia js/cards_data.js js/cards_data.json strumenti
          if git diff --cached --quiet; then echo "Niente di nuovo"; exit 0; fi
          git commit -m "Illustrazioni Gemini (API) inserite nel gioco"
          for i in 1 2 3 4 5; do git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0; sleep $((i * 10)); done
          exit 1
