name: APK Android

# Costruisce l'app Android (Capacitor: il gioco web dentro un'app) e la pubblica
# come download nella release "android-latest" del repository. Gratis con GitHub Actions.
on:
  workflow_dispatch:
  push:
    branches: [main]
    # L'app apre il sito e si aggiorna da sola: va ricostruita solo se cambia l'app stessa
    paths:
      - 'assets/icons/app_icon_512.png'
      - '.github/workflows/apk-android.yml'

permissions:
  contents: write

concurrency:
  group: apk-android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)

      - name: Prepara i file del gioco
        run: |
          mkdir -p app/www
          cp -r index.html manifest.json sw.js js css assets app/www/
          rm -f app/www/js/cards_data.json
          # Alleggerisco l'app: illustrazioni ricompresse (max 640 px), altre immagini e musica più leggere
          python - <<'EOF'
          from PIL import Image
          import glob, os
          prima = dopo = 0
          for f in glob.glob('app/www/assets/**/*.webp', recursive=True):
              prima += os.path.getsize(f)
              im = Image.open(f); im.load()
              carta = '/assets/cards/' in f
              if carta and max(im.size) > 640: im.thumbnail((640, 640), Image.LANCZOS)
              tmp = f + '.tmp'
              im.save(tmp, 'WEBP', quality=72 if carta else 82, method=6)
              if os.path.getsize(tmp) < os.path.getsize(f): os.replace(tmp, f)
              else: os.remove(tmp)
              dopo += os.path.getsize(f)
          print(f'immagini: {prima//1024} KB -> {dopo//1024} KB')
          EOF
          for f in app/www/assets/audio/*.mp3; do
            ffmpeg -loglevel error -y -i "$f" -codec:a libmp3lame -b:a 96k "$f.tmp.mp3"
            mv "$f.tmp.mp3" "$f"
          done
          du -sh app/www
          cd app
          npm init -y >/dev/null
          npm install @capacitor/core@6.2.0 @capacitor/cli@6.2.0 @capacitor/android@6.2.0
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.alexxcast.monomythos",
            "appName": "Monomythos",
            "webDir": "www",
            "backgroundColor": "#090c12",
            "server": {
              "url": "https://alexxcast.github.io/Monomytos/index.html",
              "errorPath": "index.html",
              "allowNavigation": ["alexxcast.github.io", "*.firebaseapp.com", "*.googleapis.com", "www.gstatic.com"]
            },
            "android": { "allowMixedContent": false }
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: Icona e impostazioni dell'app
        run: |
          python - <<'EOF'
          from PIL import Image
          import os, re
          src = Image.open('assets/icons/app_icon_512.png').convert('RGBA')
          res = 'app/android/app/src/main/res'
          for d, s in {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}.items():
              for n in ('ic_launcher.png', 'ic_launcher_round.png'):
                  src.resize((s, s), Image.LANCZOS).save(f'{res}/mipmap-{d}/{n}')
              # icona adattiva: il logo occupa la zona sicura centrale (66%)
              f = int(s * 108 / 48); fg = Image.new('RGBA', (f, f), (0, 0, 0, 0))
              inner = int(f * 0.66); fg.paste(src.resize((inner, inner), Image.LANCZOS), ((f - inner) // 2,) * 2)
              fg.save(f'{res}/mipmap-{d}/ic_launcher_foreground.png')
          bg = f'{res}/values/ic_launcher_background.xml'
          if os.path.exists(bg):
              x = open(bg).read()
              open(bg, 'w').write(re.sub(r'#[0-9A-Fa-f]{6,8}', '#090C12', x))
          # verticale e schermo intero come la versione web su telefono
          m = 'app/android/app/src/main/AndroidManifest.xml'
          x = open(m).read()
          if 'screenOrientation' not in x:
              x = x.replace('android:name=".MainActivity"', 'android:name=".MainActivity"\n            android:screenOrientation="portrait"', 1)
          open(m, 'w').write(x)
          EOF

      - name: Compila l'APK
        run: |
          cd app/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../Monomythos.apk

      - name: Pubblica il download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest -y --cleanup-tag || true
          gh release create android-latest Monomythos.apk \
            --title "Monomythos per Android (ultima versione)" \
            --notes "APK di prova. L'app scarica da sola gli aggiornamenti del gioco quando c'è internet e funziona anche offline. Scaricala sul telefono, aprila e consenti l'installazione da questa fonte." \
            --target "$GITHUB_SHA"

      - uses: actions/upload-artifact@v4
        with:
          name: Monomythos-apk
          path: Monomythos.apk
          retention-days: 14
