name: Genera immagini carte

on:
  workflow_dispatch:
    inputs:
      max:
        description: 'Immagini massime in questa esecuzione'
        default: '150'
  schedule:
    - cron: '30 3 * * *'   # ogni notte riprende dalle carte che mancano

permissions:
  contents: write

concurrency:
  group: genera-immagini-carte
  cancel-in-progress: false

jobs:
  genera:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Genera gli sfondi mancanti
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python strumenti/genera_immagini_carte.py --max "${{ github.event.inputs.max || '150' }}"
      - name: Salva nel repo
        if: always()
        run: |
          git config user.name "monomythos-bot"
          git config user.email "monomythos-bot@users.noreply.github.com"
          git add assets/cards/gen js/cards_data.js js/cards_data.json strumenti/anteprima_sfondi.html || true
          git diff --cached --quiet && echo "Niente di nuovo" || (git commit -m "Nuovi sfondi carte generati" && git push)
