name: Genera immagini carte

on:
  workflow_dispatch:
    inputs:
      max:
        description: 'Immagini massime in questa esecuzione'
        default: '150'
  schedule:
    - cron: '15 0 * * *'   # subito dopo il rinnovo della quota Cloudflare (00:00 UTC)

permissions:
  contents: write

concurrency:
  group: genera-immagini-carte
  cancel-in-progress: false

jobs:
  genera:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Genera gli sfondi mancanti
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python strumenti/genera_immagini_carte.py --max "${{ github.event.inputs.max || '150' }}"
      - name: Salva nel repo
        if: always()
        run: |
          git config user.name "monomythos-bot"
          git config user.email "monomythos-bot@users.noreply.github.com"
          git add assets/cards/gen js/cards_data.js js/cards_data.json strumenti/anteprima_sfondi.html strumenti/sfondi_versioni.json || true
          if git diff --cached --quiet; then echo "Niente di nuovo"; exit 0; fi
          git commit -m "Nuovi sfondi carte generati"
          # Nel frattempo qualcuno può aver aggiornato main: riallinea e riprova
          for i in 1 2 3 4; do
            git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
