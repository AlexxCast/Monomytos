name: Genera immagini carte

on:
  workflow_dispatch:
    inputs:
      max:
        description: 'Immagini massime in questa esecuzione'
        default: '45'
      modello:
        description: 'Modello Cloudflare (vuoto = FLUX.2 klein)'
        default: ''
  # Turno notturno spento il 2026-11-04: le illustrazioni ora si fanno con Gemini (vedi strumenti/originali_gemini)
  # schedule:
  #   - cron: '15 0 * * *'   # subito dopo il rinnovo della quota Cloudflare (00:00 UTC)

permissions:
  contents: write

concurrency:
  group: genera-immagini-carte
  cancel-in-progress: false

jobs:
  genera:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Controlla account e token Cloudflare
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          ATTESO=627282a64bf34298b4fa1f9db65fcd0b
          ID=$(echo -n "$CF_ACCOUNT_ID" | tr -d '[:space:]')
          if [ "$ID" = "$ATTESO" ]; then echo "CF_ACCOUNT_ID: corrisponde all'account di Alessio"; else echo "CF_ACCOUNT_ID: NON corrisponde (lunghezza ${#ID}, finisce con ${ID: -4})"; fi
          echo "Token:"; curl -s https://api.cloudflare.com/client/v4/user/tokens/verify -H "Authorization: Bearer $CF_API_TOKEN" | jq -c '{success, stato: .result.status}'
          echo "Account raggiungibili dal token:"; curl -s https://api.cloudflare.com/client/v4/accounts -H "Authorization: Bearer $CF_API_TOKEN" | jq -c '[.result[]? | {id, name}]'
      - name: Genera gli sfondi mancanti
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_MODEL: ${{ github.event.inputs.modello || '@cf/black-forest-labs/flux-2-klein-4b' }}
        # 3 versioni per carta (circa 15 carte a notte): nessuna va in gioco finché non viene scelta la migliore
        run: python strumenti/genera_immagini_carte.py --varianti 3 --max "${{ github.event.inputs.max || '45' }}"
      - name: Salva nel repo
        if: always()
        run: |
          git config user.name "monomythos-bot"
          git config user.email "monomythos-bot@users.noreply.github.com"
          git add assets/cards/gen js/cards_data.js js/cards_data.json strumenti/anteprima_sfondi.html strumenti/sfondi_versioni.json || true
          if git diff --cached --quiet; then echo "Niente di nuovo"; exit 0; fi
          git commit -m "Nuove versioni delle immagini carte da scegliere"
          # Nel frattempo qualcuno può aver aggiornato main: riallinea e riprova
          for i in 1 2 3 4; do
            git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
